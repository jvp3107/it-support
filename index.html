<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Desk</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Header Section -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-4 md:mb-0">
                <div class="bg-white text-indigo-700 p-2.5 rounded-lg shadow">
                    <i class="fa-solid fa-headset text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">IT Support Desk</h1>
                    <p class="text-indigo-200 text-sm">Submit your technical issues and track requests</p>
                </div>
            </div>
            <!-- Quick Contact Header Badge -->
            <div class="bg-indigo-800 border border-indigo-600 px-4 py-2.5 rounded-lg flex items-center space-x-3 shadow-inner">
                <i class="fa-solid fa-phone-volume text-indigo-300 text-lg"></i>
                <div>
                    <p class="text-xs text-indigo-200 uppercase font-semibold">Urgent Support Line</p>
                    <a href="tel:+971501234567" class="font-bold text-white hover:underline">+971 50 123 4567</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Ticket Form Card -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
            <div class="flex items-center space-x-3 border-b border-slate-100 pb-4 mb-6">
                <div class="bg-indigo-50 text-indigo-600 p-2 rounded-lg">
                    <i class="fa-solid fa-ticket text-lg"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900">Raise a New Support Ticket</h2>
            </div>

            <!-- Web3Forms Form Submission Target -->
            <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data" class="space-y-5">
                
                <!-- Web3Forms Access Key Integration -->
                <input type="hidden" name="access_key" value="d139da4f-b123-4cbd-b224-013a92892d4e">
                
                <!-- Hidden configurations for Web3Forms email formatting -->
                <input type="hidden" name="subject" value="🚨 New IT Support Ticket Submitted">
                <input type="hidden" name="from_name" value="IT Support Portal">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Client Name -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="name">Your Name <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="name" id="name" required class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" placeholder="John Doe">
                        </div>
                    </div>

                    <!-- Contact Number -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="phone">Contact Number <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" name="phone" id="phone" required class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" placeholder="+971 50 000 0000">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Email Address -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="email">Email Address <span class="text-rose-500">*</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" name="email" id="email" required class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" placeholder="john@company.com">
                        </div>
                    </div>

                    <!-- Issue Priority -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="priority">Priority Level</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-gauge"></i></span>
                            <select name="priority" id="priority" class="w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm bg-white transition">
                                <option value="Low - General Inquiry">Low - General Inquiry</option>
                                <option value="Medium - Impaired Operation" selected>Medium - Impaired Operation</option>
                                <option value="High - System Down / Urgent">High - System Down / Urgent</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Issue Subject -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="ticketSubject">Issue Subject <span class="text-rose-500">*</span></label>
                    <input type="text" name="ticket_subject" id="ticketSubject" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" placeholder="e.g., Cannot connect to corporate VPN / Printer error">
                </div>

                <!-- Detailed Description / Message -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="message">Description <span class="text-rose-500">*</span></label>
                    <textarea name="message" id="message" rows="4" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition resize-none" placeholder="Please describe what happened, error messages displayed, or steps to reproduce..."></textarea>
                </div>

                <!-- Screenshot Attachment -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Attach Screenshot (Optional)</label>
                    <input type="file" name="attachment" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-300 rounded-lg p-1.5 bg-slate-50"/>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-200 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Submit Ticket</span>
                </button>
            </form>
        </section>

        <!-- Direct Contact Footer Details -->
        <section class="mt-6 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-base font-bold text-slate-900 mb-3 flex items-center space-x-2">
                <i class="fa-solid fa-address-book text-indigo-600"></i>
                <span>Direct IT Support Info</span>
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-slate-600">
                <div class="flex items-center space-x-3">
                    <div class="bg-slate-100 p-2 rounded-md text-indigo-600"><i class="fa-solid fa-phone"></i></div>
                    <div>
                        <p class="font-semibold text-slate-900">Phone</p>
                        <a href="tel:+971501234567" class="text-indigo-600 hover:underline">+971 50 123 4567</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="bg-slate-100 p-2 rounded-md text-indigo-600"><i class="fa-solid fa-envelope"></i></div>
                    <div>
                        <p class="font-semibold text-slate-900">Email</p>
                        <a href="mailto:support@yourdomain.com" class="text-indigo-600 hover:underline">support@yourdomain.com</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="bg-slate-100 p-2 rounded-md text-indigo-600"><i class="fa-solid fa-clock"></i></div>
                    <div>
                        <p class="font-semibold text-slate-900">Hours</p>
                        <p>Mon - Sat (9 AM - 6 PM)</p>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
