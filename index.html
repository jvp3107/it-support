<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-700 p-2.5 rounded-lg shadow">
                    <i class="fa-solid fa-headset text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">IT Support Desk</h1>
                    <p class="text-indigo-200 text-sm">Submit your technical issues</p>
                </div>
            </div>
            <div class="bg-indigo-800 border border-indigo-600 px-4 py-2 rounded-lg flex items-center space-x-3">
                <i class="fa-solid fa-phone-volume text-indigo-300"></i>
                <div>
                    <p class="text-xs text-indigo-200 uppercase font-semibold">Direct Line</p>
                    <a href="tel:+971501234567" class="font-bold text-white text-sm">+971 50 123 4567</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
            <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center space-x-2">
                <i class="fa-solid fa-ticket text-indigo-600"></i>
                <span>Raise a New Support Ticket</span>
            </h2>

            <form id="ticketForm" class="space-y-5" onsubmit="sendToTelegram(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Your Name *</label>
                        <input type="text" id="clientName" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Contact Number *</label>
                        <input type="tel" id="contactNumber" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="+971 50 000 0000">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address *</label>
                        <input type="email" id="clientEmail" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="john@company.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Priority Level</label>
                        <select id="ticketPriority" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                            <option value="Low">Low - General Inquiry</option>
                            <option value="Medium" selected>Medium - Impaired Operation</option>
                            <option value="High">High - System Down / Urgent</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Issue Subject *</label>
                    <input type="text" id="ticketSubject" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="e.g., Cannot connect to corporate VPN">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Description *</label>
                    <textarea id="ticketDescription" rows="4" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm resize-none" placeholder="Describe error messages or steps..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Attach Screenshot (Optional)</label>
                    <input type="file" id="screenshotFile" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-300 rounded-lg p-1.5"/>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Submit Ticket</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">Ticket Submitted!</h3>
            <p id="modalTicketId" class="text-sm font-semibold text-indigo-600 mb-4"></p>
            <p class="text-xs text-slate-500 mb-6">Your request has been sent to our IT team.</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg text-sm">Close</button>
        </div>
    </div>

    <script>
        // CONFIGURATION: Put your Telegram details here
        const BOT_TOKEN = '8680843182:AAH9S4IKmXquADKzanbNA7mVUU0VuMnZpeE';
        const CHAT_ID = '@Vpticket_bot';

        async function sendToTelegram(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;

            const ticketId = 'TKT-' + Math.floor(100000 + Math.random() * 900000);
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('contactNumber').value;
            const email = document.getElementById('clientEmail').value;
            const priority = document.getElementById('ticketPriority').value;
            const subject = document.getElementById('ticketSubject').value;
            const desc = document.getElementById('ticketDescription').value;
            const fileInput = document.getElementById('screenshotFile');

            const textMessage = `🚨 *NEW IT SUPPORT TICKET* 🚨\n\n` +
                `🆔 *ID:* \`${ticketId}\`\n` +
                `👤 *Name:* ${name}\n` +
                `📞 *Phone:* ${phone}\n` +
                `📧 *Email:* ${email}\n` +
                `⚡ *Priority:* ${priority}\n` +
                `📌 *Subject:* ${subject}\n\n` +
                `📝 *Description:*\n${desc}`;

            try {
                // 1. Send Text Message
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textMessage,
                        parse_mode: 'Markdown'
                    })
                });

                // 2. Send Photo if attached
                if (fileInput.files[0]) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', fileInput.files[0]);
                    formData.append('caption', `Screenshot for ${ticketId} (${name})`);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }

                // Show Success Modal
                document.getElementById('modalTicketId').innerText = `Ticket ID: ${ticketId}`;
                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('successModal').classList.add('flex');
                document.getElementById('ticketForm').reset();

            } catch (err) {
                console.error(err);
                alert('Failed to send ticket. Please check your network connection.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit Ticket`;
            }
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('flex');
            document.getElementById('successModal').classList.add('hidden');
        }
    </script>
</body>
</html>
